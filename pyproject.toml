[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-session-proxy"
version = "0.1.0"
description = "Transparent HTTP proxy with conservative disk-backed Strata session reuse"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["aiohttp>=3.10,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[project.scripts]
strata-session-proxy = "strata_session_proxy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
